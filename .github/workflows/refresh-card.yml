# gh-ascii — daily card refresh
# Re-downloads the face + live-stats card once a day and commits only when it changed.
name: Refresh gh-ascii card

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-gh-ascii-card
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the card (face portrait + live stats)
        env:
          HANDLE: pavannithin224-abcd
          GH_ASCII_URL: https://gh.crafter.run
          FACE: https://raw.githubusercontent.com/pavannithin224-abcd/pavannithin224-abcd/master/face.png
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            "$GH_ASCII_URL/$HANDLE?theme=dark&cols=100&image=$FACE" \
            -o dark_mode.svg

      - name: Re-apply the reveal animation (survives the fresh download)
        run: python3 scripts/animate_svg.py dark_mode.svg

      - name: Commit only if the card changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg
          if git diff --cached --quiet; then
            echo "Card unchanged — nothing to commit."
          else
            git commit -m "chore: refresh gh-ascii card"
            git push
          fi
